{% extends "Base.html" %}
{% block title %}Register — LibraryHub{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="brand-name">LibraryHub</div>
        </div>
        <h2 class="auth-title">Create your account</h2>
        <p class="auth-subtitle">Start managing your personal library today</p>

        <form method="POST" action="{{ url_for('main.register') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Your display name" maxlength="50" required autofocus>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" id="email" name="email" class="form-control"
                       placeholder="you@example.com" maxlength="100" required>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Create a strong password" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100 btn-lg">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <div class="divider"></div>

        <p class="text-center" style="font-size:0.875rem;color:var(--text-muted);">
            Already have an account?
            <a href="{{ url_for('main.login') }}" style="color:var(--primary);font-weight:500;text-decoration:none;">
                Sign in
            </a>
        </p>
    </div>
</div>
{% endblock %}
