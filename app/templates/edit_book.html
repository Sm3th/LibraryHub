{% extends "Base.html" %}
{% block title %}Edit Book — LibraryHub{% endblock %}

{% block content %}
<div class="page-header" style="max-width:680px;margin:0 auto 24px;">
    <div>
        <div class="page-title"><i class="bi bi-pencil-square" style="color:var(--primary);"></i> Edit Book</div>
        <div class="page-subtitle">Update the details for "{{ book.title }}"</div>
    </div>
    <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="form-card">
    <form method="POST" action="{{ url_for('main.edit_book', book_id=book.id) }}">

        <div class="form-section-title">Book Information</div>
        <div class="mb-3">
            <label for="title" class="form-label">Book Title <span style="color:#ef4444;">*</span></label>
            <input type="text" id="title" name="title" class="form-control"
                   value="{{ book.title }}" maxlength="100" required>
        </div>

        <div class="form-row">
            <div class="mb-3">
                <label for="author" class="form-label">Author <span style="color:#ef4444;">*</span></label>
                <input type="text" id="author" name="author" class="form-control"
                       value="{{ book.author }}" maxlength="100" required>
            </div>
            <div class="mb-3">
                <label for="published_year" class="form-label">Published Year</label>
                <input type="number" id="published_year" name="published_year" class="form-control"
                       value="{{ book.published_year }}" min="1000" max="2099" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN <span style="color:#ef4444;">*</span></label>
            <input type="text" id="isbn" name="isbn" class="form-control"
                   value="{{ book.isbn or '' }}" maxlength="13" required>
        </div>

        <div class="mb-4">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3"
                      placeholder="A brief summary of the book (optional)">{{ book.description or '' }}</textarea>
        </div>

        <div class="form-section-title" style="margin-top:24px;">Details</div>
        <div class="form-row">
            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select">
                    <option value="">— Select category —</option>
                    {% for cat in ['Novel','Science Fiction','Biography','History','Fantasy','Mystery','Self-Help','Philosophy','Other'] %}
                    <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="format" class="form-label">Format</label>
                <select id="format" name="format" class="form-select">
                    <option value="Physical" {% if book.format == 'Physical' %}selected{% endif %}>Physical</option>
                    <option value="E-book"   {% if book.format == 'E-book'   %}selected{% endif %}>E-book</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label for="status" class="form-label">Reading Status</label>
            <select id="status" name="status" class="form-select">
                <option value="Unread"  {% if book.status == 'Unread'  %}selected{% endif %}>Unread</option>
                <option value="Reading" {% if book.status == 'Reading' %}selected{% endif %}>Currently Reading</option>
                <option value="Read"    {% if book.status == 'Read'    %}selected{% endif %}>Read</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-check-lg"></i> Save Changes
        </button>
    </form>
</div>
{% endblock %}
